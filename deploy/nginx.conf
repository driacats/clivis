# Clivis: il sito statico e, sotto /api/, il servizio della revisione.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://revisione:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # se davanti c'è un proxy HTTPS che imposta X-Forwarded-Proto, il cookie diventa Secure
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        client_max_body_size 1m;
    }

    # la pagina di revisione non va negli indici dei motori di ricerca
    location = /revisione.html {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
