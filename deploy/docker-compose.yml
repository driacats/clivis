# Clivis su TrueNAS: il sito (nginx) e il servizio della revisione (Node).
#
# Cartelle sul NAS:
#   /mnt/data/breviary                       il sito pubblicato (contenuto di site/dist)
#   /mnt/data/breviary-revisione/app         revisione.mjs e nginx.conf (da questo repository)
#   /mnt/data/breviary-revisione/dati        utenti e revisioni (scritta dal servizio: fanne il backup)
services:
  web:
    image: nginxinc/nginx-unprivileged:alpine
    ports:
      - '30030:8080'
    restart: unless-stopped
    user: '3000:0'
    volumes:
      - /mnt/data/breviary:/usr/share/nginx/html:ro
      - /mnt/data/breviary-revisione/app/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - revisione

  revisione:
    image: node:22-alpine
    restart: unless-stopped
    user: '3000:0'
    command: ['node', '/app/revisione.mjs']
    environment:
      DATI: /dati
      SITO: /sito
      # solo per il primo avvio: crea l'amministratore «andrea» con questa password.
      # Dopo il primo accesso cambiala dalla pagina e togli questa riga.
      CLIVIS_ADMIN_PASSWORD: 'scegli-una-password'
    volumes:
      - /mnt/data/breviary-revisione/app/revisione.mjs:/app/revisione.mjs:ro
      - /mnt/data/breviary-revisione/dati:/dati
      - /mnt/data/breviary:/sito:ro
